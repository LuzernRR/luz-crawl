<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>LuzCrawl 本地浏览器接口测试</title><style>body{font:18px/1.8 system-ui;max-width:700px;margin:50px auto;padding:24px}button,input,select{font:inherit;padding:10px;margin:12px 0}#spacer{height:1100px;background:linear-gradient(#edf5ec,#fff)}</style></head><body><h1>LuzCrawl 本地接口测试</h1><p>这里的点击、输入和预览只改变当前本地页面。</p><button id="counter">点击计数</button><p id="count">0</p><label for="message">测试文字</label><input id="message"><button id="preview">预览文字</button><p id="result"></p><form id="search"><label for="query">搜索内容</label><input id="query" name="q" required value="原始值"><label for="kind">范围</label><select id="kind"><option value="public">公开资料</option><option value="all">全部</option></select><label><input type="checkbox" id="include-images">包含图片</label><button id="search-submit" type="submit">搜索</button></form><form id="verification"><label for="otp">验证码</label><input id="otp" autocomplete="one-time-code"><button type="submit">确认验证码</button></form><p id="search-result"></p><p id="late" hidden>异步结果已加载</p><div id="spacer"></div><p id="bottom">滚动目标</p><script>window.submissions=0;document.querySelector('#counter').onclick=()=>document.querySelector('#count').textContent=String(Number(document.querySelector('#count').textContent)+1);document.querySelector('#preview').onclick=()=>document.querySelector('#result').textContent=document.querySelector('#message').value;document.querySelector('#search').onsubmit=event=>{event.preventDefault();window.submissions++;setTimeout(()=>{document.querySelector('#search-result').textContent='已搜索：'+document.querySelector('#query').value+' / '+document.querySelector('#kind').value;document.querySelector('#late').hidden=false;},60);};</script></body></html>
