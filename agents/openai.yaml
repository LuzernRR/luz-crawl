interface:
  display_name: "LuzCrawl"
  short_description: "直接调用浏览器扩展抓取多平台正文，保存证据并复用搜索经验"
  icon_small: "./assets/icon-400.png"
  icon_large: "./assets/logo.png"
  brand_color: "#8FB396"
  default_prompt: "使用 $luz-crawl 为本会话或项目绑定一个独立的编号主题目录，后续搜索与续接复用该 folder；源数据保存到 raw/，同级只更新一个按 luz-design 文件规范生成的同名 HTML，并校验实际来源证据。"
policy:
  allow_implicit_invocation: true
