name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests
        run: node --test skills/luz-crawl/tests/*.test.mjs
      - name: Build and verify packages
        run: python skills/luz-crawl/scripts/package.py --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: LuzCrawl-packages
          path: dist/*
