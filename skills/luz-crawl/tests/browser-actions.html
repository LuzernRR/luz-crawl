<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>LuzCrawl 本地浏览器接口测试</title><style>body{font:18px/1.8 system-ui;max-width:700px;margin:50px auto;padding:24px}button,input{font:inherit;padding:10px;margin:12px 0}#spacer{height:1100px;background:linear-gradient(#edf7ff,#fff)}</style></head><body><h1>LuzCrawl 本地接口测试</h1><p>这里的点击、输入和预览只改变当前本地页面。</p><button id="counter">点击计数</button><p id="count">0</p><label for="message">测试文字</label><input id="message"><button id="preview">预览文字</button><p id="result"></p><div id="spacer"></div><p id="bottom">滚动目标</p><script>document.querySelector('#counter').onclick=()=>document.querySelector('#count').textContent=String(Number(document.querySelector('#count').textContent)+1);document.querySelector('#preview').onclick=()=>document.querySelector('#result').textContent=document.querySelector('#message').value;</script></body></html>
